name: Deploy KRATOS AI to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'kratos-ai/**'
      - '.github/workflows/deploy-kratos-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # OIDC avoids storing an Azure client secret in GitHub.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "kratos-ai:${GITHUB_SHA}" \
            --file kratos-ai/Dockerfile \
            kratos-ai

      - name: Deploy immutable image revision
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$ACR_LOGIN_SERVER/kratos-ai:${GITHUB_SHA}"
